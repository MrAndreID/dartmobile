name: dart_mobile
description: "A Flutter mobile app skeleton (iOS & Android) with Hello World and User CRUD features backed by the MrAndreID/goapi service."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Routing
  go_router: ^14.2.0

  # Value equality for models/state
  equatable: ^2.0.5

  # Env / config
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
